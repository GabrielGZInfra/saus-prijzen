name: Prijzen ophalen

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prijzen
  cancel-in-progress: false

jobs:
  prijzen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prijzen lezen uit de bestelsite
        env:
          PRIJZEN_BRON: ${{ vars.PRIJZEN_BRON }}
        run: node scripts/prijzen.mjs
      - name: Committen bij een wijziging
        id: commit
        run: |
          git add -N site/prijzen.json
          if git diff --quiet -- site/prijzen.json; then
            echo "gewijzigd=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/prijzen.json
            git commit -m "Prijzen bijgewerkt"
            git push
            echo "gewijzigd=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.gewijzigd == 'true' || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.gewijzigd == 'true' || github.event_name == 'workflow_dispatch'
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.commit.outputs.gewijzigd == 'true' || github.event_name == 'workflow_dispatch'
