# Tijdelijk, alleen voor de branch acties-op-site: maakt een prijzen.json met acties op deze branch,
# zodat het concept in Framer echte gegevens toont. Geen Pages-deploy; bijsaus.nl verandert hierdoor niet.
# Weghalen vóór het samenvoegen met main.
name: Concept acties (tijdelijk)

on:
  push:
    branches: [acties-op-site]
    paths: ["scripts/**", ".github/workflows/concept.yml"]

permissions:
  contents: write

jobs:
  concept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test zonder internet
        run: node scripts/test-bestelsite.mjs
      - name: Prijzen en acties lezen uit de bestelsite
        env:
          PRIJZEN_BRON: ${{ vars.PRIJZEN_BRON }}
        run: node scripts/prijzen.mjs
      - name: Committen op deze branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/prijzen.json
          git diff --cached --quiet || git commit -m "Concept: prijzen.json met acties"
          git push
